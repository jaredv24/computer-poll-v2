name: Update poll (manual backup; Vercel rebuilds the data on deploy)

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season (defaults to the current one)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy pandas pyarrow
      - name: Build poll
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python pipeline/build_poll.py ${{ github.event.inputs.season }}
      - name: Commit data
        run: |
          git config user.name "computer-poll-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ logos/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update poll data"
            git pull --rebase -X theirs origin main
            git push
          fi
